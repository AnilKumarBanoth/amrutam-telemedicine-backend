apiVersion: v1
kind: Service
metadata:
  name: amrutam-backend-service
  namespace: amrutam-prod
  labels:
    app: amrutam-backend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: amrutam-backend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: amrutam-backend-ingress
  namespace: amrutam-prod
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/proxy-body-size: "5m"
spec:
  tls:
    - hosts:
        - api.amrutam.co.in
      secretName: amrutam-tls-cert
  rules:
    - host: api.amrutam.co.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: amrutam-backend-service
                port:
                  number: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: amrutam-config
  namespace: amrutam-prod
data:
  NODE_ENV: "production"
  PORT: "3000"
  HOST: "0.0.0.0"
  DB_HOST: "amrutam-pg-cluster.internal"
  DB_PORT: "5432"
  DB_NAME: "amrutam_telemedicine"
  DB_POOL_MIN: "5"
  DB_POOL_MAX: "50"
  DB_USE_MEMORY_FALLBACK: "false"
  REDIS_HOST: "amrutam-redis.internal"
  REDIS_PORT: "6379"
  REDIS_USE_MEMORY_FALLBACK: "false"
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX_REQUESTS: "120"
  LOG_LEVEL: "info"
---
apiVersion: v1
kind: Secret
metadata:
  name: amrutam-secrets
  namespace: amrutam-prod
type: Opaque
stringData:
  DB_USER: "amrutam_db_admin"
  DB_PASSWORD: "ProdDbSuperSecurePassword2026!"
  JWT_SECRET: "amrutam-prod-jwt-secret-min-64-characters-production-secure-hash!"
  JWT_REFRESH_SECRET: "amrutam-prod-refresh-jwt-secret-min-64-characters-secure-hash!"
  ENCRYPTION_MASTER_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  PRESCRIPTION_SIGNING_KEY: "amrutam-digital-prescription-signing-key-production-grade"
