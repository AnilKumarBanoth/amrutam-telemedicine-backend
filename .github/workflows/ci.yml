name: CI/CD Pipeline - Amrutam Telemedicine Backend

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Quality & Security Checks
  validate:
    name: Lint, Typecheck & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Checking
        run: npx tsc --noEmit

      - name: Run Security Vulnerability Audit
        run: npm audit --audit-level=high

  # 2. Automated Tests & Concurrency Proof
  test:
    name: Automated Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Automated Test Suite (Jest)
        run: npm run test:coverage

      - name: Run Concurrency & Booking Demo Script
        run: npm run demo

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/

  # 3. Docker Image Build Validation
  build-docker:
    name: Docker Container Build & Scan
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          tags: amrutam/telemedicine-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
